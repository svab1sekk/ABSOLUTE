name: Publish Windows download

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/download-windows-x64
          path: package
      - name: Verify download
        working-directory: package
        run: |
          sha256sum --check SHA256SUMS.txt
          python3 -m zipfile -t ABSOLUTE-win-x64.zip
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            package/ABSOLUTE-win-x64.zip \
            package/SHA256SUMS.txt \
            --verify-tag \
            --title "ABSOLUTE 0.1.0 Preview" \
            --notes-file package/README.txt \
            --prerelease
